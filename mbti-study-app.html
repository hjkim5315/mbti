<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBTI 학습 유형 진단 | 대학생 공부법 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(160deg, #EDF6F4 0%, #F7FAF9 60%, #EDF2F6 100%);
    min-height: 100vh;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 36px;
    max-width: 540px;
    width: 100%;
    box-shadow: 0 4px 32px rgba(60,120,100,0.09);
  }

  /* ── SCREEN TOGGLE ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── INTRO ── */
  .intro-badge {
    display: inline-block;
    background: #E8F6F2;
    color: #2D9E7E;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .intro-title {
    font-size: 26px;
    font-weight: 700;
    color: #1A2E28;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .intro-title span { color: #2D9E7E; }
  .intro-desc {
    font-size: 14.5px;
    color: #5A7068;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .intro-meta {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .meta-chip {
    background: #F2F8F6;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: #3A6B5E;
    font-weight: 500;
    flex: 1;
    min-width: 90px;
  }
  .meta-chip strong { display: block; font-size: 15px; color: #1A2E28; margin-bottom: 2px; }

  /* ── PROGRESS ── */
  .progress-wrap { margin-bottom: 28px; }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8FA89F;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .progress-bar {
    height: 6px;
    background: #E8F0EE;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2D9E7E, #38C9A0);
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── QUESTION ── */
  .q-axis {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #2D9E7E;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 700;
    color: #1A2E28;
    line-height: 1.55;
    margin-bottom: 26px;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    border: 2px solid #E4EDEA;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    color: #2E4A42;
    font-weight: 500;
    line-height: 1.6;
    transition: border-color 0.18s, background 0.18s, transform 0.12s;
    font-family: 'Noto Sans KR', sans-serif;
    width: 100%;
  }
  .choice-btn:hover {
    border-color: #2D9E7E;
    background: #F2FAF7;
    transform: translateY(-1px);
  }
  .choice-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #E8F0EE;
    color: #2D9E7E;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .nav-row { margin-top: 24px; }
  .btn-back {
    padding: 11px 20px;
    border: 2px solid #D8E8E4;
    border-radius: 12px;
    background: #fff;
    color: #5A7068;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-back:hover { border-color: #2D9E7E; color: #2D9E7E; }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    padding: 15px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2D9E7E, #27B890);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity 0.15s, transform 0.12s;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ── RESULT ── */
  .result-header {
    text-align: center;
    padding-bottom: 26px;
    border-bottom: 1px solid #EEF4F2;
    margin-bottom: 26px;
  }
  .result-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 26px;
    border-radius: 99px;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .result-name {
    font-size: 13px;
    font-weight: 700;
    color: #5A7068;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .result-tagline {
    font-size: 17px;
    font-weight: 700;
    color: #1A2E28;
    line-height: 1.5;
  }
  .result-style {
    font-size: 13.5px;
    color: #5A7068;
    line-height: 1.75;
    margin-top: 10px;
  }

  .section-title {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #2D9E7E;
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .guide-section {
    background: #F7FAF9;
    border-radius: 14px;
    padding: 16px 18px;
  }
  .tips-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .tips-list li { font-size: 13.5px; color: #2E4A42; line-height: 1.65; }
  .guide-text { font-size: 13.5px; color: #2E4A42; line-height: 1.75; }

  .caution-section {
    background: #FFF8F0;
    border-left: 3px solid #F0A860;
    border-radius: 0 12px 12px 0;
    padding: 14px 18px;
    margin-top: 20px;
    margin-bottom: 24px;
  }
  .caution-title {
    font-size: 11px;
    font-weight: 700;
    color: #C4844A;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .caution-text { font-size: 13.5px; color: #6B4A28; line-height: 1.7; }

  .btn-restart {
    width: 100%;
    padding: 14px;
    border: 2px solid #2D9E7E;
    border-radius: 12px;
    background: #fff;
    color: #2D9E7E;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  .btn-restart:hover { background: #2D9E7E; color: #fff; }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .intro-title { font-size: 22px; }
    .q-text { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">

    <!-- ── INTRO SCREEN ── -->
    <div id="screen-intro" class="screen active">
      <div class="intro-badge">대학생 학습 유형 진단</div>
      <h1 class="intro-title">나에게 맞는<br><span>공부법</span>을 찾아보세요</h1>
      <p class="intro-desc">
        12가지 질문에 솔직하게 답하면, 나의 MBTI 유형과 함께
        학습 스타일·시험 전략·추천 환경을 알려드립니다.
      </p>
      <div class="intro-meta">
        <div class="meta-chip"><strong>12문항</strong>소요 시간 약 3분</div>
        <div class="meta-chip"><strong>16유형</strong>상세 학습 가이드</div>
        <div class="meta-chip"><strong>무료</strong>로그인 불필요</div>
      </div>
      <button class="btn-primary" onclick="startQuiz()">검사 시작하기 →</button>
    </div>

    <!-- ── QUIZ SCREEN ── -->
    <div id="screen-quiz" class="screen">
      <div class="progress-wrap">
        <div class="progress-row">
          <span id="axis-label">에너지 방향</span>
          <span id="q-counter">1 / 12</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <div class="q-axis" id="q-axis"></div>
      <p class="q-text" id="q-text"></p>
      <div class="choices">
        <button class="choice-btn" id="btn-a" onclick="choose(0)">
          <span class="choice-letter">A</span>
          <span id="label-a"></span>
        </button>
        <button class="choice-btn" id="btn-b" onclick="choose(1)">
          <span class="choice-letter">B</span>
          <span id="label-b"></span>
        </button>
      </div>
      <div class="nav-row" id="back-row" style="display:none">
        <button class="btn-back" onclick="goBack()">← 이전</button>
      </div>
    </div>

    <!-- ── RESULT SCREEN ── -->
    <div id="screen-result" class="screen">
      <div class="result-header">
        <div class="result-type-badge" id="result-badge"></div>
        <div class="result-name" id="result-name"></div>
        <div class="result-tagline" id="result-tagline"></div>
        <div class="result-style" id="result-style"></div>
      </div>
      <div class="section-title">📖 과목별 공부법</div>
      <div class="guide-section"><ul class="tips-list" id="result-tips"></ul></div>
      <div class="section-title">📝 시험 전략</div>
      <div class="guide-section"><p class="guide-text" id="result-exam"></p></div>
      <div class="section-title">🏠 추천 학습 환경</div>
      <div class="guide-section"><p class="guide-text" id="result-env"></p></div>
      <div class="caution-section">
        <div class="caution-title">⚠️ 주의할 점</div>
        <p class="caution-text" id="result-caution"></p>
      </div>
      <button class="btn-restart" onclick="restart()">↺ 다시 검사하기</button>
    </div>

  </div>
</div>

<script>
// ── 데이터: 문항 ──
const QUESTIONS = [

    text:"조별 과제에서 역할을 정할 때, 나는…",

  { axis:"SN", axisLabel:"정보 수집",

  { axis:"TF", axisLabel:"판단 기준",

  { axis:"TF", axisLabel:"판단 기준",
    text:"학점이나 성과를 평가받을 때 내가 더 중요하게 보는 것은?",
    a:{label:"결과가 객관적으로 공정한지, 기준이 명확한지", value:"T"},

    b:{label:"시험이 가까워질수록 집중이 되어 그때그때 필요한 것부터 한다", value:"P"} },

// ── 데이터: 16유형 ──

let currentIdx = 0;

function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startQuiz() {
  answers = [];
  currentIdx = 0;
  renderQuestion();
  show('screen-quiz');
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const total = QUESTIONS.length;
  const pct = (currentIdx / total) * 100;

  document.getElementById('axis-label').textContent = q.axisLabel;
  document.getElementById('q-counter').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-axis').textContent = `${q.axis[0]} vs ${q.axis[1]}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('label-a').textContent = q.a.label;
  document.getElementById('label-b').textContent = q.b.label;
  document.getElementById('back-row').style.display = currentIdx > 0 ? 'block' : 'none';
}

function choose(optionIdx) {
  const q = QUESTIONS[currentIdx];
  const value = optionIdx === 0 ? q.a.value : q.b.value;
  answers[currentIdx] = value;
  currentIdx++;

  if (currentIdx >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion();
  }
}

function calcMBTI(ans) {
  const c = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  ans.forEach(v => { if(v) c[v]++; });
  return (c.E>=c.I?'E':'I') + (c.S>=c.N?'S':'N') + (c.T>=c.F?'T':'F') + (c.J>=c.P?'J':'P');
}

function showResult() {
  const mbti = calcMBTI(answers);
  const d = MBTI_DATA[mbti];
  if (!d) return;

  document.getElementById('result-badge').style.background = d.color;
  document.getElementById('result-badge').innerHTML = `<span>${d.emoji}</span> ${mbti}`;
  document.getElementById('result-name').textContent = d.name;
  document.getElementById('result-tagline').textContent = d.tagline;
  document.getElementById('result-style').textContent = d.style;

  const tipsList = document.getElementById('result-tips');
  tipsList.innerHTML = d.tips.map(t => `<li>${t}</li>`).join('');

  document.getElementById('result-exam').textContent = d.exam;
  document.getElementById('result-env').textContent = d.environment;
  document.getElementById('result-caution').textContent = d.caution;

  // 결과 화면으로 스크롤
  show('screen-result');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  answers = [];
  currentIdx = 0;
  show('screen-intro');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
